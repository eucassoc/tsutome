name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      # dlog, so the test that has deedlog verify a chain tsutome wrote runs here
      - run: go install github.com/eucassoc/deedlog/cmd/dlog@v0.1.0
      - run: npm ci
      - run: npm test
        env:
          DLOG: dlog
